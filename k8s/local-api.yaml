apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-api
  labels:
    app: local-api
spec:
  replicas: 0
  selector:
    matchLabels:
      app: local-api
  template:
    metadata:
      labels:
        app: local-api
    spec:
      containers:
        - name: local-api
          image: demo-proxy-azure-pubsub-local-api:local
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: local-api
  labels:
    app: local-api
spec:
  type: ClusterIP
  selector:
    app: local-api
  ports:
    - name: http
      port: 80
      targetPort: 3000
