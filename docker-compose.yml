version: "3.9"

services:
  valkey:
    image: valkey/valkey:alpine
    container_name: valkey
    ports:
      - "6379:6379"
    command: ["valkey-server", "--appendonly", "yes"]

  proxy-server:
    build:
      context: packages/proxy-server
    container_name: proxy-server
    environment:
      # Required: Azure Web PubSub connection string
      - PUBSUB_CONNECTION_STRING=${PUBSUB_CONNECTION_STRING}
      - REDIS_URL=redis://valkey:6379
    ports:
      - "30000:3000"
    depends_on:
      - valkey

  local-api:
    build:
      context: packages/local-api
    container_name: local-api
    environment:
      - CLIENT_ID=client-a
      - PORT=3000

  proxy-client:
    build:
      context: packages/proxy-client
    environment:
      - LOCAL_API_URL=http://local-api:3000
      # Use server-issued token (no connection string needed)
      - AUTH_URL=http://proxy-server:3000/auth
      - TENANT_ID=test-tenant
    depends_on:
      - proxy-server
      - local-api

