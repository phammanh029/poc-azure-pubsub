version: "3.9"

services:
  valkey:
    image: valkey/valkey:alpine
    container_name: valkey
    ports:
      - "6379:6379"
    command: ["valkey-server", "--appendonly", "yes"]

  proxy-server:
    build:
      context: packages/proxy-server
    container_name: proxy-server
    environment:
      # Required: Azure Web PubSub connection string
      - PUBSUB_CONNECTION_STRING=${PUBSUB_CONNECTION_STRING}
      - REDIS_URL=redis://valkey:6379
    ports:
      - "30000:3000"
    depends_on:
      - valkey

  proxy-client:
    build:
      context: packages/proxy-client
    environment:
      # Use server-issued token (no connection string needed)
      - AUTH_URL=http://proxy-server:3000/auth
    depends_on:
      - proxy-server

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    environment:
      - REDIS_HOSTS=local:valkey:6379
    ports:
      - "8081:8081"
    depends_on:
      - valkey
